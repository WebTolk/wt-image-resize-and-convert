PLG_WTIMAGERESIZECONVERT_DESC="Автоматически изменяет размеры, конвертирует и добавляет водяной знак к изображениям, загруженным через Joomla Media Manager."
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_INFO_LABEL="Информация о плагине"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_INFO_DESC="Показывает установленную версию плагина и сведения о расширении WebTolk. Это информационное поле: оно не влияет на обработку изображений."
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_FIELDSET_WATERMARK="Водяной знак"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_ENABLED_LABEL="Включить обработку"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_ENABLED_DESC="Включите параметр, чтобы плагин обрабатывал поддерживаемые изображения до того, как Joomla сохранит их в Media Manager. Отключите его, если нужно временно оставлять загружаемые файлы без изменений, не удаляя плагин."
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_PROCESSOR_BACKEND_LABEL="Обработчик изображений"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_PROCESSOR_BACKEND_DESC="Выбирает движок обработки изображений. Сейчас поддерживается только Joomla Core Image: он использует встроенный API изображений Joomla и PHP-расширение GD."
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_PROCESSOR_BACKEND_JOOMLA_CORE="Joomla Core Image"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_MAX_WIDTH_LABEL="Максимальная ширина"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_MAX_WIDTH_DESC="Максимальная ширина сохраненного изображения в пикселях. Поле используется только если режим изменения размера не равен Не изменять. В режиме Вписать в границы это итоговая ширина холста; в режимах ширины, высоты и обрезки значение используется как ограничение ширины. Укажите 0, чтобы не ограничивать ширину."
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_MAX_HEIGHT_LABEL="Максимальная высота"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_MAX_HEIGHT_DESC="Максимальная высота сохраненного изображения в пикселях. Поле используется только если режим изменения размера не равен Не изменять. В режиме Вписать в границы это итоговая высота холста; в режимах ширины, высоты и обрезки значение используется как ограничение высоты. Укажите 0, чтобы не ограничивать высоту."
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_RESIZE_MODE_LABEL="Режим изменения размера"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_RESIZE_MODE_DESC="Определяет, как плагин рассчитывает итоговый размер изображения. Не изменять сохраняет исходные размеры. Вписать в границы создает холст по заданной ширине и высоте, сохраняет пропорции изображения и заполняет пустые поля сверху, снизу или сбоку выбранным цветом заливки изображения. Обрезка заполняет точную ширину и высоту с обрезанием краев. Режим ширины ориентируется на лимит ширины, а режим высоты - на лимит высоты."
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_RESIZE_MODE_NONE="Не изменять"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_RESIZE_MODE_FIT="Вписать в границы"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_RESIZE_MODE_CROP="Обрезать до точного размера"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_RESIZE_MODE_WIDTH="Подогнать по ширине"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_RESIZE_MODE_HEIGHT="Подогнать по высоте"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_IMAGE_FILL_COLOR_LABEL="Цвет заливки изображения"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_IMAGE_FILL_COLOR_DESC="Цвет, которым заполняются пустые области в режиме Вписать в границы, когда холст заданной ширины и высоты не совпадает с пропорциями загруженного изображения. Например, у широкого изображения внутри квадратного холста могут появиться поля сверху и снизу. В режимах Не изменять, обрезки, ширины и высоты параметр не используется."
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_ALLOW_UPSCALE_LABEL="Разрешить увеличение"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_ALLOW_UPSCALE_DESC="Если параметр выключен, маленькие изображения сохраняют исходный размер и не растягиваются. Включайте его только когда небольшие загрузки нужно увеличивать до заданного размера: это может ухудшить визуальное качество."
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_OUTPUT_FORMAT_LABEL="Итоговый формат"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_OUTPUT_FORMAT_DESC="Выберите формат файла, который Joomla сохранит после обработки. Оставить исходный сохраняет формат загрузки; выбор JPG, PNG, GIF, WEBP или AVIF конвертирует файл, если PHP-расширение GD на сервере поддерживает этот формат."
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_FORMAT_KEEP="Оставить исходный"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_QUALITY_LABEL="Качество"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_QUALITY_DESC="Качество сжатия для JPG, WEBP и AVIF. Большие значения обычно дают более красивое изображение, но увеличивают размер файла; меньшие значения уменьшают файл ценой более заметного сжатия. На PNG этот параметр не влияет."
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_PNG_COMPRESSION_LABEL="Сжатие PNG"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_PNG_COMPRESSION_DESC="Уровень сжатия для PNG от 0 до 9. Большие значения могут уменьшить размер PNG-файла, но обработка может занять больше времени. Сжатие PNG без потерь, поэтому качество изображения от этого значения не ухудшается."
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_STRICT_MODE_LABEL="Строгий режим"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_STRICT_MODE_DESC="Если параметр выключен, ошибка обработки игнорируется и Joomla продолжает сохранять исходную загрузку. Включите строгий режим, если сохранение файла должно прерываться при любой ошибке изменения размера, конвертации или нанесения водяного знака."
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_WATERMARK_ENABLED_LABEL="Включить водяной знак"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_WATERMARK_ENABLED_DESC="Добавляет выбранное изображение водяного знака поверх обработанных загрузок. Оставьте параметр выключенным, если файлы нужно только изменять или конвертировать без видимой метки."
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_WATERMARK_PATH_LABEL="Изображение водяного знака"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_WATERMARK_PATH_DESC="Выберите изображение из Joomla Media Manager, которое будет использоваться как водяной знак. Файл должен быть доступен Joomla для чтения, а в настройке сохраняется путь к нему относительно сайта."
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_WATERMARK_POSITION_LABEL="Позиция водяного знака"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_WATERMARK_POSITION_DESC="Определяет, где водяной знак будет размещен на готовом изображении. Угловые позиции используют горизонтальный и вертикальный отступы ниже; позиция по центру размещает знак в середине."
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_POSITION_TOP_LEFT="Сверху слева"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_POSITION_TOP_RIGHT="Сверху справа"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_POSITION_CENTER="По центру"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_POSITION_BOTTOM_LEFT="Снизу слева"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_POSITION_BOTTOM_RIGHT="Снизу справа"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_WATERMARK_OPACITY_LABEL="Прозрачность водяного знака"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_WATERMARK_OPACITY_DESC="Управляет заметностью водяного знака. Значение 100 означает полностью непрозрачный знак; меньшие значения делают его прозрачнее, чтобы исходное изображение было лучше видно."
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_WATERMARK_SCALE_LABEL="Ширина водяного знака"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_WATERMARK_SCALE_DESC="Задает ширину водяного знака в процентах от ширины обработанного изображения. Например, 20 означает, что знак будет масштабирован примерно до одной пятой ширины итогового изображения."
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_WATERMARK_MARGIN_X_LABEL="Горизонтальный отступ"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_WATERMARK_MARGIN_X_DESC="Горизонтальное расстояние в пикселях между водяным знаком и левым или правым краем изображения. Используется для угловых позиций и не влияет на размещение по центру."
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_WATERMARK_MARGIN_Y_LABEL="Вертикальный отступ"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_WATERMARK_MARGIN_Y_DESC="Вертикальное расстояние в пикселях между водяным знаком и верхним или нижним краем изображения. Используется для угловых позиций и не влияет на размещение по центру."
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_FIELDSET_FOLDER_RULES="Правила для папок"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_PROCESSING_PROFILES_LABEL="Пользовательские профили обработки"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_PROCESSING_PROFILES_DESC="Добавьте именованные профили для папок, которым нужны настройки, отличающиеся от значений на вкладках «Обработка» и «Водяной знак». Текущие настройки всегда остаются профилем по умолчанию."
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_PROFILE_ID_LABEL="Идентификатор профиля"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_PROFILE_ID_DESC="Уникальный технический идентификатор для правил папок. Используйте буквы, цифры, дефисы и подчёркивания; не используйте default."
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_PROFILE_TITLE_LABEL="Название профиля"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_PROFILE_TITLE_DESC="Понятное название, которое выводится при выборе профиля в правиле папки."
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_FOLDER_RULES_LABEL="Правила обработки для папок"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_FOLDER_RULES_DESC="Каждое правило назначает один сохранённый профиль одной или нескольким папкам. Путь охватывает все вложенные папки; применяется наиболее конкретный совпавший путь."
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_FOLDER_RULE_PROFILE_LABEL="Профиль обработки"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_FOLDER_RULE_PROFILE_DESC="Выберите профиль по умолчанию или сохранённый пользовательский профиль. После добавления нового профиля сохраните и снова откройте форму, чтобы он появился в этом списке."
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_FOLDER_RULE_PROFILE_SELECT="- Выберите профиль обработки -"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_FOLDER_RULE_PROFILE_DEFAULT="Профиль обработки по умолчанию"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_FOLDER_RULE_PATHS_LABEL="Пути к папкам"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_FOLDER_RULE_PATHS_DESC="Введите по одному пути к папке Media Manager относительно корня сайта в строке, например images/products. Путь действует для самой папки и всех её вложенных папок."
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_FIELDSET_PROCESSING_PROFILES="Профили обработки"
