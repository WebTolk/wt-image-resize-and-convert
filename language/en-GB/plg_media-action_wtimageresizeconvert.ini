PLG_WTIMAGERESIZECONVERT_DESC="Automatically resizes, converts and watermarks images uploaded through Joomla Media Manager."
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_INFO_LABEL="Plugin information"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_INFO_DESC="Shows the installed plugin version and WebTolk extension information. This field is informational only and does not change image processing."
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_FIELDSET_WATERMARK="Watermark"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_ENABLED_LABEL="Enable processing"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_ENABLED_DESC="Turn this on to process supported image uploads before Joomla saves them in Media Manager. Turn it off to leave uploaded files unchanged while keeping the plugin installed."
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_PROCESSOR_BACKEND_LABEL="Image processor"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_PROCESSOR_BACKEND_DESC="Selects the image processing engine. Joomla Core Image is currently the only supported engine and uses Joomla's built-in image API with the PHP GD extension."
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_PROCESSOR_BACKEND_JOOMLA_CORE="Joomla Core Image"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_MAX_WIDTH_LABEL="Maximum width"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_MAX_WIDTH_DESC="Largest allowed width of the saved image in pixels. This field is used only when resize mode is not Do not resize. In Fit inside bounds mode it is the final canvas width; in the width, height and crop modes it is used as the width limit. Use 0 to ignore the width limit."
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_MAX_HEIGHT_LABEL="Maximum height"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_MAX_HEIGHT_DESC="Largest allowed height of the saved image in pixels. This field is used only when resize mode is not Do not resize. In Fit inside bounds mode it is the final canvas height; in the width, height and crop modes it is used as the height limit. Use 0 to ignore the height limit."
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_RESIZE_MODE_LABEL="Resize mode"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_RESIZE_MODE_DESC="Controls how the plugin calculates the final image size. Do not resize keeps the original dimensions. Fit inside bounds creates a canvas from the configured width and height, keeps image proportions, and fills empty side or top/bottom areas with the selected image fill color. Crop fills the exact width and height by cutting edges. Width uses the width limit, and height uses the height limit."
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_RESIZE_MODE_NONE="Do not resize"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_RESIZE_MODE_FIT="Fit inside bounds"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_RESIZE_MODE_CROP="Crop to exact size"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_RESIZE_MODE_WIDTH="Match width"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_RESIZE_MODE_HEIGHT="Match height"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_IMAGE_FILL_COLOR_LABEL="Image fill color"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_IMAGE_FILL_COLOR_DESC="Color used for empty areas when Fit inside bounds creates a canvas that does not match the uploaded image proportions. For example, a wide image fitted into a square can have top and bottom bands filled with this color. The setting is ignored in Do not resize, crop, width and height modes."
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_ALLOW_UPSCALE_LABEL="Allow upscaling"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_ALLOW_UPSCALE_DESC="When disabled, small images keep their original dimensions and are not enlarged. Enable this only if smaller uploads should be scaled up to match the configured size, which can reduce visual quality."
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_OUTPUT_FORMAT_LABEL="Output format"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_OUTPUT_FORMAT_DESC="Choose the file format Joomla should save after processing. Keep original preserves the upload format; choosing JPG, PNG, GIF, WEBP or AVIF converts the file when the server's GD extension supports that format."
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_FORMAT_KEEP="Keep original"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_QUALITY_LABEL="Quality"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_QUALITY_DESC="Compression quality for JPG, WEBP and AVIF output. Higher values usually look better but create larger files; lower values reduce file size with more visible compression. This setting does not control PNG compression."
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_PNG_COMPRESSION_LABEL="PNG compression"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_PNG_COMPRESSION_DESC="Compression level for PNG output from 0 to 9. Higher values can make PNG files smaller but processing may take longer. PNG compression is lossless, so image quality is not reduced by this value."
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_STRICT_MODE_LABEL="Strict mode"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_STRICT_MODE_DESC="When disabled, an image processing error is ignored and Joomla continues saving the original upload. Enable strict mode if upload saving must fail whenever resizing, conversion or watermarking fails."
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_WATERMARK_ENABLED_LABEL="Enable watermark"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_WATERMARK_ENABLED_DESC="Adds the selected watermark image on top of processed uploads. Leave disabled if uploads should only be resized or converted without a visible mark."
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_WATERMARK_PATH_LABEL="Watermark image"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_WATERMARK_PATH_DESC="Select an image from Joomla Media Manager to use as the watermark. The selected file must be readable by Joomla and is stored as a site-relative media path."
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_WATERMARK_POSITION_LABEL="Watermark position"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_WATERMARK_POSITION_DESC="Chooses where the watermark is placed on the final image. Corner positions use the horizontal and vertical margins below; center places the watermark in the middle."
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_POSITION_TOP_LEFT="Top left"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_POSITION_TOP_RIGHT="Top right"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_POSITION_CENTER="Center"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_POSITION_BOTTOM_LEFT="Bottom left"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_POSITION_BOTTOM_RIGHT="Bottom right"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_WATERMARK_OPACITY_LABEL="Watermark opacity"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_WATERMARK_OPACITY_DESC="Controls how visible the watermark is. 100 means fully opaque, lower values make it more transparent so the original image remains more visible."
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_WATERMARK_SCALE_LABEL="Watermark width"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_WATERMARK_SCALE_DESC="Sets the watermark width as a percentage of the processed image width. For example, 20 means the watermark will be scaled to about one fifth of the final image width."
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_WATERMARK_MARGIN_X_LABEL="Horizontal margin"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_WATERMARK_MARGIN_X_DESC="Horizontal distance in pixels between the watermark and the left or right image edge. This is used for corner positions and ignored for the center position."
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_WATERMARK_MARGIN_Y_LABEL="Vertical margin"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_WATERMARK_MARGIN_Y_DESC="Vertical distance in pixels between the watermark and the top or bottom image edge. This is used for corner positions and ignored for the center position."
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_FIELDSET_FOLDER_RULES="Folder rules"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_PROCESSING_PROFILES_LABEL="Custom processing profiles"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_PROCESSING_PROFILES_DESC="Add named profiles for folders that need settings different from the default Processing and Watermark tabs. Existing settings always remain the default profile."
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_PROFILE_ID_LABEL="Profile ID"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_PROFILE_ID_DESC="Unique technical identifier used by folder rules. Use letters, numbers, hyphens and underscores; do not use default."
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_PROFILE_TITLE_LABEL="Profile name"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_PROFILE_TITLE_DESC="Human-readable name shown when choosing this profile in a folder rule."
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_FOLDER_RULES_LABEL="Folder processing rules"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_FOLDER_RULES_DESC="Each rule assigns one saved profile to one or more folders. Paths include all descendant folders; the most specific matching path wins."
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_FOLDER_RULE_PROFILE_LABEL="Processing profile"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_FOLDER_RULE_PROFILE_DESC="Choose the default profile or a saved custom profile. Save and reload this form after adding a new profile so it becomes available here."
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_FOLDER_RULE_PROFILE_SELECT="- Select a processing profile -"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_FOLDER_RULE_PROFILE_DEFAULT="Default processing profile"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_FOLDER_RULE_PATHS_LABEL="Folder paths"
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_FOLDER_RULE_PATHS_DESC="Enter one site-root-relative Media folder per line, for example images/products. A path applies to that folder and all of its subfolders."
PLG_MEDIA-ACTION_WTIMAGERESIZECONVERT_FIELDSET_PROCESSING_PROFILES="Processing Profiles"
